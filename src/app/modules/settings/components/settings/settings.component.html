<div class="layout layout--full">
    <div class="container">
        <div class="sub-title">
            <h5>تهيئة النظام</h5>
        </div>
        <div class="setting-wrap">
            <div *ngIf="list_of_sections.length > 0" class="row">
                <div *ngFor="let item of list_of_sections" class="col-lg-3 col-md-6 col-sm-6">
                    <div class="list-of-values" [ngClass]="{'disabled':item.nested && !selectedMainOrg}">
                        <span class="icon" [innerHTML]="item.icon">

                        </span>
                        <div *ngIf="item.nested" class="list-of-values__nested">
                            <app-dropdown  (dropdownValue)="getDropdownValue($event)" [field]="item.nested"></app-dropdown>
                        </div>
                        <div (click)="initModal($event,item)" class="list-of-values__data">
                            <h6>{{item.name}}</h6>
                            <span>{{item.count}} عنصر</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-6">
                <div class="list-of-values">
                    <span class="icon">

                    <div class="list-of-values__middle">
                        <app-checkbox (checkValue)="toggleValue($event)" *ngIf="sendMail.type == 'checkbox'" [field]="sendMail"></app-checkbox>
                    </div>
                    <div class="list-of-values__data">
                        <h6>إرسال البريد الإكتروني</h6>
                        <span>-</span>
                    </div>
                </div>
            </div>

            <app-no-data *ngIf="list_of_sections.length == 0"></app-no-data>
        </div>

<p-dialog [header]="modalTitle" [modal]="true" [(visible)]="isShowLOVModal" (onHide)="closeModal()" [style]="{ width: '600px' }">
    <div class="modal-box">
        <div class="modal-box__up">
            <form [formGroup]="addNewForm" class="modal-box__form">
                <div class="modal-box__row modal-box__wrap">
                    <app-input-text [formGroup]="addNewForm" [field]="addNewControl"></app-input-text>
                    <div *ngIf="currentObject.key == 'transactionAdjective'" class="modal-box__picker">
                        <p-colorPicker formControlName="backGroundColor" />
                    </div>
                    <button (click)="submitNewChoice(addNewForm)" [disabled]="addNewForm.invalid" class="btn btn--primary">
                        <p class="font-line">إضافة جديد</p>
                    </button>
                </div>
            </form>
            <div *ngIf="currentObjectOptions.length > 0" class="options-list">
                <div *ngFor="let item of currentObjectOptions" class="options-list__one">
                    <div class="options-list__input">
                        <input [disabled]="item.isDisabled" type="text" [(ngModel)]="item.name" class="input" />
                        <div *ngIf="currentObject.key == 'transactionAdjective' && !item.isDisabled && item.name" class="modal-box__picker modal-box__picker--mini">
                            <p-colorPicker [(ngModel)]="item.backGroundColor" />
                        </div>
                        <span (click)="submitEdit(item)" *ngIf="!item.isDisabled && item.name" class="icon confirm">

                        </span>
                    </div>
                    <div class="options-list__actions">
                        <span class="icon edit" (click)="edit(item)">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"

                </div>
            </div>
            <app-no-data *ngIf="currentObjectOptions.length == 0"></app-no-data>
        </div>
    </div>
</p-dialog>

<p-confirmDialog [style]="{ width: '25rem'}" #cd>
    <ng-template pTemplate="message" let-message>
        <div class="confirmation-wrap">
            <h4 class="title">حذف عنصر</h4>
            <p class="message">هل تريد حذف هذا العنصر ؟</p>
            <div class="buttons">
                <button (click)="cd.accept()" class="btn btn--primary"><p class="font-line">حذف</p></button>
                <button (click)="cd.reject()" class="btn btn--danger"><p class="font-line">إلغاء</p></button>
            </div>
        </div>
    </ng-template>
</p-confirmDialog>
