<div class="layout layout--full">
    <div class="container">
        <div class="sub-title">
            <h5>كل الإشعارات</h5>
        </div>
        <div class="notifications all">
            <div *ngIf="notificationsList.length > 0" class="notifications__list">
                <ng-container *ngFor="let item of notificationsList">
                    <div *ngIf="item.registrationNumber" (click)="goToTransaction(item)" class="notifications__record">
                        <div  class="dot"
                            [ngClass]="{'readed':item.isSeen,'unreaded':!item.isSeen}">
                            <span class="icon"></span>
                        </div>
                        <div>
                            <p>{{item?.description}}</p>
                            <span>{{item?.createdDate | date:'medium'}}</span>
                        </div>
                    </div>
                </ng-container>
                <a *ngIf="totalCount > notificationsList.length" (click)="loadMore()" class="btn btn--primary btn--icon">
                    <span class="icon">
                        <svg height="1792" viewBox="0 0 1792 1792" width="1792" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M1344 800v64q0 14-9 23t-23 9h-352v352q0 14-9 23t-23 9h-64q-14 0-23-9t-9-23v-352h-352q-14 0-23-9t-9-23v-64q0-14 9-23t23-9h352v-352q0-14 9-23t23-9h64q14 0 23 9t9 23v352h352q14 0 23 9t9 23zm128 448v-832q0-66-47-113t-113-47h-832q-66 0-113 47t-47 113v832q0 66 47 113t113 47h832q66 0 113-47t47-113zm128-832v832q0 119-84.5 203.5t-203.5 84.5h-832q-119 0-203.5-84.5t-84.5-203.5v-832q0-119 84.5-203.5t203.5-84.5h832q119 0 203.5 84.5t84.5 203.5z" />
                        </svg>
                    </span>
                    <p class="font-line">عرض المزيد</p>
                </a>
            </div>
            <app-no-data *ngIf="notificationsList.length == 0">

            </app-no-data>
        </div>
    </div>
</div>
