<div class="layout">
    <div class="container">
        <div class="sub-title">
            <h5>{{groupDetails?.name}}</h5>
        </div>
        <div class="sub-title">
            <a (click)="back()" class="btn btn--tertiary btn--icon">

                        <path

                            fill="white" />
                    </svg>

                <p class="font-line">عودة للمجموعة</p>
            </a>
        </div>

                            </div>

                        <app-no-data *ngIf="groupDetails?.users.length == 0"></app-no-data>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<p-confirmDialog [style]="{ width: '25rem'}" #cd>
    <ng-template pTemplate="message" let-message>
        <div class="confirmation-wrap">
            <h4 class="title">حذف عضو</h4>
            <p class="message">هل أنت متأكد من حذف هذا العضو ؟</p>
            <div class="buttons">
                <button (click)="cd.accept()" class="btn btn--primary"><p class="font-line">حذف</p></button>
                <button (click)="cd.reject()" class="btn btn--danger"><p class="font-line">إلغاء</p></button>
            </div>
        </div>
    </ng-template>
</p-confirmDialog>
