<div class="layout">
    <div class="container">
        <div class="sub-title">
            <h5>{{groupDetails?.name}}</h5>
        </div>
        <div class="sub-title">
            <a (click)="back()" class="btn btn--tertiary btn--icon">
                <span class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M13.4697 8.53033C13.1768 8.23744 13.1768 7.76256 13.4697 7.46967C13.7626 7.17678 14.2374 7.17678 14.5303 7.46967L18.5303 11.4697C18.8232 11.7626 18.8232 12.2374 18.5303 12.5303L14.5303 16.5303C14.2374 16.8232 13.7626 16.8232 13.4697 16.5303C13.1768 16.2374 13.1768 15.7626 13.4697 15.4697L16.1893 12.75H6.5C6.08579 12.75 5.75 12.4142 5.75 12C5.75 11.5858 6.08579 11.25 6.5 11.25H16.1893L13.4697 8.53033Z"
                            fill="white" />
                    </svg>
                </span>
                <p class="font-line">عودة للمجموعات</p>
            </a>
        </div>
        <div class="flex">
            <div class="layout__main">
                <form *ngIf="editPermissionsForm" class="group-details" [formGroup]="editPermissionsForm">
                    <div class="content-box">
                        <div class="content-box__head">
                            <h6>الصلاحيات</h6>
                        </div>
                        <div class="content-box__body">
                            <div *ngFor="let list of permissionsList" class="group-details__info">
                                <div class="content-box__subTitle">
                                    <p>{{list.name}}</p>
                                </div>
                                <div class="permissions-list">
                                    <div class="row">
                                        <div *ngFor="let permission of list.permissions" class="permissions-list__item col-md-4 col-sm-6">
                                            <app-checkbox (checkValue)="checkboxValue($event)" *ngIf="permission.type == 'checkbox'" [field]="permission" [formGroup]="editPermissionsForm"></app-checkbox>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </form>
            </div>
            <div class="layout__aside">
                <div class="content-box content-box--primary">
                    <div class="content-box__head">
                        <h6>حفظ التعديلات</h6>
                    </div>
                    <div class="content-box__body">
                        <div class="buttons-holder">
                            <a (click)="updatePermissions()" class="btn btn--secondary btn--icon">
                                <span class="icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21.4144 5.99991L9.00015 18.4141L2.58594 11.9999L4.00015 10.5857L9.00015 15.5857L20.0002 4.58569L21.4144 5.99991Z" fill="black"/></svg>
                                </span>
                                <p class="font-line">حفظ التعديلات</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
